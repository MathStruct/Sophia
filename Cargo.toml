# Sophia: Rust workspace manifest.
#
# Sophia is the content-addressed store; sophialang is its own language
# (vault/Decisions/S-ADR-0007). The plan is vault/Plans/Milestones.md.
#
# The repository is also an Obsidian vault, and wikilinks resolve by file
# name, so no crate has a lib.rs: each sets its [lib] path explicitly, and
# every source file has a same-named .md sibling explaining it.
#
# Crates that were comment-only placeholders and are not part of the current
# milestones were moved to attic/ (excluded below).

[workspace]
resolver = "3"
members = [
    "crates/sophia-hash",        # canonical framing, BLAKE3 digests, component ordering
    "crates/sophialang-core",    # sophialang's core terms and normaliser
    "crates/sophialang-syntax",  # printer and parser of the rendering profiles
    "crates/sophia-store",       # the store: Backend trait, logic, backends
    "crates/sophia-interface",   # what Moonkale wraps (SPEC-004)
    "crates/sophia-query",       # Sophia's own query language (SPEC-007)
    "crates/sophia-ingest",      # frontends for real code (B-16): Metamath first
    "crates/sophia-bench",       # the benchmark suite
    "crates/sophia-cli",         # the `sophia` command
]
exclude = ["attic"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
blake3 = "1.8"
rusqlite = { version = "0.40", features = ["bundled", "hooks", "serialize"] }
redb = "4.4"
duckdb = { version = "1.10506", features = ["bundled"] }
heed = "0.22"
thiserror = "2"
proptest = "1.12"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

sophia-hash = { path = "crates/sophia-hash" }
sophialang-core = { path = "crates/sophialang-core" }
sophialang-syntax = { path = "crates/sophialang-syntax" }
sophia-store = { path = "crates/sophia-store" }
sophia-bench = { path = "crates/sophia-bench" }
sophia-interface = { path = "crates/sophia-interface" }
sophia-query = { path = "crates/sophia-query" }
sophia-ingest = { path = "crates/sophia-ingest" }
