# Sophia Core calculus, kernel and elaboration. See src/sophia_core.md.
[package]
name = "sophia-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Explicit path so that no file in the repo is named lib.rs: Obsidian resolves
# [[wikilinks]] by filename, and every code file has a same-named .md sibling.
path = "src/sophia_core.rs"

[dependencies]
sophia-hash = { path = "../sophia-hash" }
