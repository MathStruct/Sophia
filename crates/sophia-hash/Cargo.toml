# Canonical framing, BLAKE3 digests and the ordering of recursive groups.
# See src/sophia_hash.md and vault/Specifications/SPEC-001 Sophia Store v0.md §4.
[package]
name = "sophia-hash"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/sophia_hash.rs"

[dependencies]
blake3.workspace = true
thiserror.workspace = true

# Stack growth for deep recursion (SP-015). Not on wasm32, where it cannot
# protect the engine's call stack: there `deep::grow` is a placeholder.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker.workspace = true

[dev-dependencies]
proptest.workspace = true
