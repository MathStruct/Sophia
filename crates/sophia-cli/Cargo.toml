# The `sophia` command. See src/main.md.
[package]
name = "sophia-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sophia"
path = "src/main.rs"

[dependencies]
sophia-hash.workspace = true
sophialang-core.workspace = true
sophia-store.workspace = true
sophia-bench.workspace = true
sophia-interface = { workspace = true, features = ["lmdb", "duckdb"] }
