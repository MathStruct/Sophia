# The Sophia store: the Backend trait, the store logic, and its backends.
# See src/sophia_store.md and vault/Specifications/SPEC-001 Sophia Store v0.md.
[package]
name = "sophia-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/sophia_store.rs"

[features]
default = ["sqlite", "redb"]
sqlite = ["dep:rusqlite"]
redb = ["dep:redb"]
duckdb = ["dep:duckdb"]
lmdb = ["dep:heed"]

[dependencies]
sophia-hash.workspace = true
thiserror.workspace = true
blake3.workspace = true
rusqlite = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }
heed = { workspace = true, optional = true }

[dev-dependencies]
sophialang-core.workspace = true
tempfile.workspace = true
