# Frontends that bring real code into Sophia (B-16). Metamath first.
# See src/sophia_ingest.md and vault/Plans/Real Code Corpora.md.
[package]
name = "sophia-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/sophia_ingest.rs"

[dependencies]
sophia-hash.workspace = true
sophia-store = { path = "../sophia-store", default-features = false }
thiserror.workspace = true
# Moonkale's WP-66 normal form, shared so a definition has one id in both
# (SR-116). Only tree-sitter grammars and blake3.
moonkale-content-id = { git = "https://github.com/MathStruct/Moonkale.git", rev = "c166fbd6518d41d7c09a3379eb8e55958ccb1ad0" }

[dev-dependencies]
moonkale-content-id = { git = "https://github.com/MathStruct/Moonkale.git", rev = "c166fbd6518d41d7c09a3379eb8e55958ccb1ad0" }
sophia-store = { path = "../sophia-store", features = ["lmdb", "duckdb"] }
tempfile.workspace = true
