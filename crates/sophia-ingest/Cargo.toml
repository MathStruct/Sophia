# Frontends that bring real code into Sophia (B-16). Metamath first.
# See src/sophia_ingest.md and vault/Plans/Real Code Corpora.md.
[package]
name = "sophia-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/sophia_ingest.rs"

[dependencies]
sophia-hash.workspace = true
sophia-store = { path = "../sophia-store", default-features = false }
thiserror.workspace = true
# E-6: the oracle names texts by SHA-256 (Julia's SHA stdlib); checked on import.
sha2 = "0.11"
# Moonkale's WP-66 normal form, shared so a definition has one id in both
# (SR-116). Only tree-sitter grammars and blake3.
moonkale-content-id = { git = "https://github.com/MathStruct/Moonkale.git", rev = "06fd112c75927d1b59ca4a1e883444dbfcc5b238" }

[dev-dependencies]
moonkale-content-id = { git = "https://github.com/MathStruct/Moonkale.git", rev = "06fd112c75927d1b59ca4a1e883444dbfcc5b238" }
sophia-store = { path = "../sophia-store", features = ["lmdb", "duckdb"] }
tempfile.workspace = true
# lean_statements (E-10): statement hashes and declaration lines.
blake3.workspace = true
serde_json.workspace = true
sophia-query.workspace = true
# lean_layout (B-033, M-1): builds lean copies of a SQLite store.
rusqlite.workspace = true
