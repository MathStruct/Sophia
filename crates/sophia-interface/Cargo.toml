# What Moonkale's `sources/sophia` adapter wraps (SPEC-004). Public types hold
# no Moonkale, driver or async-runtime types. See src/sophia_interface.md.
[package]
name = "sophia-interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/sophia_interface.rs"

[features]
default = ["sqlite", "redb"]
sqlite = ["sophia-store/sqlite", "sophia-query/sqlite"]
redb = ["sophia-store/redb", "sophia-query/redb"]
lmdb = ["sophia-store/lmdb", "sophia-query/lmdb"]
duckdb = ["sophia-store/duckdb", "sophia-query/duckdb"]

[dependencies]
sophia-hash.workspace = true
sophia-store = { path = "../sophia-store", default-features = false }
sophia-query = { path = "../sophia-query", default-features = false }
sophialang-core.workspace = true
sophialang-syntax.workspace = true
thiserror.workspace = true
blake3.workspace = true

[dev-dependencies]
tempfile.workspace = true
